name: Run analysis pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: run-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the analysis pipeline
        run: python src/weather_regimes.py

      # The regenerated figures are published as a downloadable artifact rather
      # than committed back to the repository, so every commit in the history
      # is authored by a person.
      - name: Upload outputs as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs_regimes/
